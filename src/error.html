<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<meta name="theme-color" content="#135661" />
		<meta name="color-scheme" content="light only" />
		<link rel="icon" href="/favicon.png" />
		<title>Error %sveltekit.status% | Days Until</title>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}
			html {
				min-height: 100%;
				background-color: #f1f5f9;
				background-image: linear-gradient(to top left, #70e1f5, #ffd194);
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 1rem;
				color: #0f172a;
				font-family: ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
				-webkit-font-smoothing: antialiased;
			}
			.card {
				width: 100%;
				max-width: 56rem;
				border-radius: 0.5rem;
				background: #fff;
				padding: 2.5rem 1.5rem;
				box-shadow:
					0 10px 15px -3px rgb(0 0 0 / 0.1),
					0 4px 6px -4px rgb(0 0 0 / 0.1);
				text-align: center;
			}
			.icon {
				margin: 0 auto;
				display: flex;
				width: 4rem;
				height: 4rem;
				align-items: center;
				justify-content: center;
				border: 1px solid #e5e7eb;
				border-radius: 9999px;
				color: #0da4bf;
			}
			.status {
				margin: 2rem 0 0;
				font-size: 0.875rem;
				font-weight: 500;
				color: #64748b;
			}
			h1 {
				margin: 0.5rem 0 0;
				font-size: 1.875rem;
				line-height: 1.2;
				font-weight: 900;
			}
			p.lede {
				margin: 1rem auto 0;
				max-width: 28rem;
				line-height: 1.75;
				color: #374151;
			}
			.actions {
				margin-top: 2rem;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.75rem;
			}
			.btn {
				display: inline-flex;
				width: 100%;
				align-items: center;
				justify-content: center;
				border-radius: 0.5rem;
				padding: 0.5rem 1rem;
				font: inherit;
				font-size: 0.875rem;
				font-weight: 500;
				line-height: 1.25rem;
				text-decoration: none;
				cursor: pointer;
			}
			.btn-primary {
				border: 1px solid #0da4bf;
				background: #0da4bf;
				color: #fff;
			}
			.btn-primary:hover {
				background: #0a7b8f;
			}
			.btn-secondary {
				border: 1px solid #cbd5e1;
				background: #fff;
				color: #334155;
			}
			.btn-secondary:hover {
				background: #f8fafc;
			}
			.btn:focus-visible {
				outline: 2px solid #0a7b8f;
				outline-offset: 2px;
			}
			footer {
				margin: 1rem 0 2rem;
				font-size: 0.875rem;
				color: #1e293b;
			}
			footer a {
				color: inherit;
			}
			@media (min-width: 640px) {
				.actions {
					flex-direction: row;
					justify-content: center;
				}
				.btn {
					width: auto;
				}
			}
			@media (min-width: 1024px) {
				.card {
					padding: 3rem;
				}
				h1 {
					font-size: 2.25rem;
				}
			}
		</style>
	</head>
	<body>
		<main class="card">
			<div class="icon">
				<svg
					width="28"
					height="28"
					stroke="currentColor"
					fill="none"
					stroke-width="1.5"
					viewBox="0 0 24 24"
					aria-hidden="true"
					xmlns="http://www.w3.org/2000/svg"
				>
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"
					/>
				</svg>
			</div>
			<p class="status">%sveltekit.status%</p>
			<h1>Something went wrong</h1>
			<p class="lede">We ran into an unexpected problem. Please try again in a moment.</p>
			<div class="actions">
				<button type="button" class="btn btn-primary" onclick="location.reload()">Try again</button>
				<a class="btn btn-secondary" href="/">Back to home</a>
			</div>
		</main>
		<footer><a href="https://michaelbonner.dev">Michael Bonner</a></footer>
	</body>
</html>
